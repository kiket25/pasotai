  const rest = shuffle(ALLQ.filter(id => !ids.includes(id))); while (ids.length < n && rest.length) ids.push(rest.pop());
  ids = shuffle(ids.slice(0, n));
  SIM = {ids, opts: ids.map(id => shuffle([QMAP[id].c, ...QMAP[id].w])), ans: ids.map(() => null), i:0, end: Date.now() + n * 72 * 1000, done:false, timer:null};
  SIM.timer = setInterval(() => { if (!SIM || SIM.done) return clearInterval(SIM && SIM.timer); const left = Math.max(0, Math.ceil((SIM.end - Date.now()) / 1000)); const c = $("#simClock"); if (c) c.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; if (left <= 0) { toast("¡Tiempo! Se entrega el simulacro."); finishSim(); } }, 1000);
  render();
}
function finishSim(){
  clearInterval(SIM.timer); SIM.done = true;
  let A = 0, E = 0, B = 0;
  SIM.ids.forEach((id, i) => { const a = SIM.ans[i]; if (a === null) B++; else { const ok = SIM.opts[i][a] === QMAP[id].c; ok ? A++ : E++; grade(id, ok); } });
  const neta = A - E / 3, nota = Math.max(0, neta / SIM.ids.length * 10);
  SIM.res = {A, E, B, neta, nota};
  state.sims.push({date: today(), n: SIM.ids.length, A, E, B, nota: Math.round(nota * 100) / 100});
  state.sims = state.sims.slice(-30);
  addXP(Math.round(A * 2)); save(); beep("done"); if (nota >= 5) confetti();
  render(); window.scrollTo(0, 0);
}
function renderSimResult(app){
  const r = SIM.res, n = SIM.ids.length;
  const wrong = SIM.ids.map((id, i) => ({id, i})).filter(x => SIM.ans[x.i] !== null && SIM.opts[x.i][SIM.ans[x.i]] !== QMAP[x.id].c);
  app.innerHTML = `<div class="stack"><div class="result" style="padding-top:0">${mascot(r.nota >= 5 ? "wow" : "happy")}<h1 class="num">${r.nota.toFixed(2)} / 10</h1><p class="muted">Puntuación neta: ${r.neta.toFixed(2)} de ${n} (aciertos − errores ÷ 3)</p></div>
    <div class="tiles" style="margin:0"><div class="tile-s"><span>Aciertos</span><b class="num" style="color:var(--ok)">${r.A}</b></div><div class="tile-s"><span>Errores</span><b class="num" style="color:var(--ko)">${r.E}</b></div><div class="tile-s"><span>En blanco</span><b class="num">${r.B}</b></div></div>
    ${wrong.length ? `<div class="card"><h3>Revisa tus fallos</h3><div class="stack" style="margin-top:10px">${wrong.map(x => { const q = QMAP[x.id]; return `<div><b>${esc(q.q)}</b><div class="small" style="color:var(--ko)">Tu respuesta: ${esc(SIM.opts[x.i][SIM.ans[x.i]])}</div><div class="small" style="color:var(--ok)">Correcta: ${esc(q.c)}</div><div class="small muted">${esc(q.e)}</div></div>`; }).join("")}</div><p class="note">Estas preguntas se han añadido a tu repaso inteligente.</p></div>` : ""}
    <button class="btn block" data-act="simReset">Hacer otro simulacro</button><button class="btn ghost block" data-act="home">Volver al inicio</button></div>`;
}

/* ---------------- Progreso ---------------- */
function renderStats(app){
  const t = dayNum(); let cells = "";
  const startD = t - 27 - ((new Date(fromDayNum(t - 27) + "T12:00:00").getDay() + 6) % 7);
  for (let d = startD; d <= t; d++) { const x = state.days[fromDayNum(d)] || 0; const l = x === 0 ? "" : x < state.goal / 2 ? "l1" : x < state.goal ? "l2" : "l3"; cells += `<i class="${l}${d === t ? " today" : ""}" title="${fromDayNum(d)}: ${x} XP"></i>`; }
  const totalOk = ALLQ.reduce((a, id) => a + ((state.q[id] || {}).ok || 0), 0), totalKo = ALLQ.reduce((a, id) => a + ((state.q[id] || {}).ko || 0), 0);
  app.innerHTML = `<div class="stack"><h1>Tu progreso</h1>
    <div class="statgrid">
      <div class="card"><b class="num" style="font-size:1.8rem;font-family:var(--display);color:var(--flame)">${liveStreak()}</b><div class="muted small">días de racha (mejor: ${state.best})</div></div>
      <div class="card"><b class="num" style="font-size:1.8rem;font-family:var(--display);color:var(--warn)">${state.xp}</b><div class="muted small">XP totales</div></div>
      <div class="card"><b class="num" style="font-size:1.8rem;font-family:var(--display);color:var(--ok)">${mastered()}</b><div class="muted small">preguntas dominadas de ${ALLQ.length}</div></div>
      <div class="card"><b class="num" style="font-size:1.8rem;font-family:var(--display);color:var(--accent)">${totalOk + totalKo ? Math.round(totalOk / (totalOk + totalKo) * 100) + "%" : "—"}</b><div class="muted small">acierto global</div></div>
    </div>
    <div class="card"><h3>Últimas 4 semanas</h3><div class="row muted small" style="justify-content:space-between;margin:8px 0 6px"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="heat">${cells}</div><p class="muted small" style="margin:10px 0 0">Verde intenso = meta diaria cumplida.</p></div>
    <div class="card stack"><h3>Acierto por bloque</h3>${BLOCKS.map(b => { const a = blockAcc(b.id); return `<div class="bline"><span>${b.short}</span><div class="bar"><i style="width:${a.pct || 0}%;background:${b.color}"></i></div><span class="num">${a.pct === null ? "—" : a.pct + "%"}</span></div>`; }).join("")}</div>
    <div class="card stack"><h3>Dominio por unidad</h3>${UNITS.map(u => `<div class="bline"><span class="small" title="${esc(u.t)}">${esc(u.code)}</span><div class="bar"><i style="width:${unitProgress(u)}%;background:${blockOf(u.b).color}"></i></div><span class="num small">${unitProgress(u)}%</span></div>`).join("")}</div>
    ${state.sims.length ? `<div class="card"><h3>Simulacros</h3><table><thead><tr><th>Fecha</th><th>Preg.</th><th>A/E/B</th><th>Nota</th></tr></thead><tbody>${state.sims.slice().reverse().map(s => `<tr class="num"><td>${s.date}</td><td>${s.n}</td><td>${s.A}/${s.E}/${s.B}</td><td><b style="color:${s.nota >= 5 ? "var(--ok)" : "var(--ko)"}">${s.nota.toFixed(2)}</b></td></tr>`).join("")}</tbody></table></div>` : ""}
  </div>`;
}

/* ---------------- Ajustes ---------------- */
function seg(key, opts){ return `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-act="set" data-k="${key}" data-v="${v}" aria-pressed="${String(state.settings[key]) === String(v)}">${l}</button>`).join("")}</div>`; }
function renderSettings(app){
  const s = state.settings;
  app.innerHTML = `<div class="stack"><h1>Ajustes</h1>
    <div class="card"><h3>Ritmo</h3>
      <div class="set"><label>Meta diaria</label><div class="seg" role="group">${[[10,"Suave"],[30,"Normal"],[60,"Intensa"],[100,"Máxima"]].map(([v,l]) => `<button data-act="goal" data-v="${v}" aria-pressed="${state.goal === v}">${l} · ${v}</button>`).join("")}</div></div>
      <div class="set"><label for="sHearts">Modo vidas (5 fallos por lección)<div class="muted small">Desactivado = sin presión</div></label><input type="checkbox" class="switch" id="sHearts" data-act="toggle" data-k="hearts" ${s.hearts ? "checked" : ""}></div>
      <div class="set"><label for="sSound">Sonidos de acierto y error</label><input type="checkbox" class="switch" id="sSound" data-act="toggle" data-k="sound" ${s.sound ? "checked" : ""}></div>
    </div>
    <div class="card"><h3>Lectura y concentración</h3>
      <div class="set"><label>Tipo de letra</label>${seg("font", [["lexend","Lexend"],["atkinson","Hiperlegible"],["system","Sistema"]])}</div>
      <div class="set"><label>Tamaño del texto</label>${seg("size", [[15,"A−"],[17,"A"],[20,"A+"],[23,"A++"]])}</div>
      <div class="set"><label for="sCalm">Modo calma<div class="muted small">Sin animaciones ni confeti</div></label><input type="checkbox" class="switch" id="sCalm" data-act="toggle" data-k="calm" ${s.calm ? "checked" : ""}></div>
      <div class="set"><label>Tema</label>${seg("theme", [["auto","Auto"],["light","Claro"],["dark","Oscuro"]])}</div>
    </div>
    <div class="card stack"><h3>Tu progreso</h3>
      <p class="muted small" style="margin:0">${syncState === "ok" ? "Tu progreso se guarda en tu cuenta y se sincroniza entre el móvil y el ordenador." : "Tu progreso se guarda en este dispositivo. Abre la app con tu cuenta para sincronizarlo, o copia una copia de seguridad."}</p>
      <div class="row"><button class="btn ghost sm" data-act="export">Copiar copia de seguridad</button><button class="btn ghost sm" data-act="importOpen">Restaurar copia</button></div>
      <button class="link" style="align-self:flex-start;color:var(--ko)" data-act="resetAsk">Borrar todo el progreso</button>
    </div>
    <p class="note">PasoTAI es una herramienta de estudio personal. El contenido se apoya en el programa oficial del cuerpo de Técnicos Auxiliares de Informática de la AGE y en la normativa vigente; ante cualquier duda, manda el BOE.</p></div>`;
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { closeModal(); return go(g.dataset.go); }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "scrim") { if (e.target === el) closeModal(); return; }
  switch (a) {
    case "closeModal": closeModal(); break;
    case "focus": toggleFocus(); break;
    case "unit": openUnit(el.dataset.u); break;
    case "startUnit": startLesson("lesson", {unit: el.dataset.u}); break;
    case "cheat": { const u = UMAP[el.dataset.u]; showModal(`<div class="stack">${cheatHTML(u)}<button class="btn block" data-act="startUnit" data-u="${u.id}">Practicar esta unidad</button><button class="link" data-act="closeModal">Cerrar</button></div>`); break; }
    case "aiLesson": aiLesson(el.dataset.u); break;
    case "today": { if (dueIds().length >= 3) startLesson("review"); else startLesson("lesson", {unit: nextUnit().id}); break; }
    case "quick": { if (dueIds().length) startLesson("review", {quick:true}); else startLesson("lesson", {unit: nextUnit().id, quick:true}); break; }
    case "review": startLesson("review"); break;
    case "reviewQuick": startLesson("review", {quick:true}); break;
    case "cheatDone": L.cheat = false; if (L.unit) { state.units[L.unit.id] = Object.assign(state.units[L.unit.id] || {lvl:0}, {seen:true}); save(); } render(); break;
    case "quit": showModal(`<div class="stack" style="text-align:center">${mascot("sad")}<h2>¿Seguro que quieres salir?</h2><p class="muted">Si sales ahora perderás el progreso de esta lección. ¡Te queda poco!</p><button class="btn block" data-act="closeModal">Seguir aprendiendo</button><button class="link" style="color:var(--ko)" data-act="quitYes">Salir</button></div>`); break;
    case "quitYes": closeModal(); go("home"); break;
    case "pick": if (L && !L.checked) { L.sel = +el.dataset.k; render(); } break;
    case "check": checkAnswer(); break;
    case "next": nextItem(); break;
    case "explain": explainAI(); break;
    case "tile": tapTile(el.dataset.side, +el.dataset.i); break;
    case "again": { const k = el.dataset.kind; if (k === "lesson" && el.dataset.u) startLesson("lesson", {unit: el.dataset.u}); else if (k === "review") startLesson("review"); else startLesson("lesson", {unit: nextUnit().id}); break; }
    case "home": go("home"); break;
    case "simStart": startSim(+el.dataset.n); break;
    case "simPick": SIM.ans[SIM.i] = +el.dataset.k; render(); break;
    case "simBlank": SIM.ans[SIM.i] = null; render(); break;
    case "simNext": SIM.i = Math.min(SIM.ids.length - 1, SIM.i + 1); render(); window.scrollTo(0,0); break;
    case "simPrev": SIM.i = Math.max(0, SIM.i - 1); render(); break;
    case "simFinish": { const blank = SIM.ans.filter(x => x === null).length; showModal(`<div class="stack"><h2>¿Entregar el simulacro?</h2><p class="muted">${blank ? `Tienes ${blank} pregunta${blank > 1 ? "s" : ""} en blanco (no restan).` : "Has respondido todas las preguntas."}</p><button class="btn block" data-act="simFinishYes">Entregar</button><button class="link" data-act="closeModal">Seguir revisando</button></div>`); break; }
    case "simFinishYes": closeModal(); finishSim(); break;
    case "simQuit": showModal(`<div class="stack"><h2>¿Abandonar el simulacro?</h2><p class="muted">No se guardará ningún resultado.</p><button class="btn block" data-act="closeModal">Continuar el simulacro</button><button class="link" style="color:var(--ko)" data-act="simQuitYes">Abandonar</button></div>`); break;
    case "simQuitYes": closeModal(); clearInterval(SIM.timer); SIM = null; render(); break;
    case "simReset": SIM = null; render(); break;
    case "goal": state.goal = +el.dataset.v; save(); render(); break;
    case "set": { const k = el.dataset.k, v = el.dataset.v; state.settings[k] = k === "size" ? +v : v; applySettings(); save(); render(); break; }
    case "export": { const txt = JSON.stringify(state); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Copia de seguridad copiada. Pégala en una nota o un correo."), () => showModal(`<div class="stack"><h2>Copia de seguridad</h2><p class="muted small">Selecciona y copia este texto:</p><textarea readonly id="exportTxt">${esc(txt)}</textarea><button class="btn block" data-act="closeModal">Hecho</button></div>`)); break; }
    case "importOpen": showModal(`<div class="stack"><h2>Restaurar copia</h2><p class="muted small">Pega aquí el texto de tu copia de seguridad. Sustituirá el progreso actual.</p><textarea id="importTxt" aria-label="Copia de seguridad"></textarea><button class="btn block" data-act="importDo">Restaurar</button><button class="link" data-act="closeModal">Cancelar</button></div>`); break;
    case "importDo": { try { const s = JSON.parse($("#importTxt").value); if (!s || typeof s !== "object" || !("xp" in s)) throw 0; state = migrate(s); applySettings(); save(); closeModal(); toast("Progreso restaurado"); render(); } catch(err) { toast("Ese texto no es una copia válida de PasoTAI"); } break; }
    case "resetAsk": showModal(`<div class="stack"><h2>¿Borrar todo el progreso?</h2><p class="muted">Se perderán XP, racha, repasos y simulacros. No se puede deshacer.</p><button class="btn kob block" data-act="resetYes">Sí, borrar todo</button><button class="link" data-act="closeModal">Cancelar</button></div>`); break;
    case "resetYes": { const st = state.settings; state = fresh(); state.settings = st; save(); closeModal(); toast("Progreso borrado"); go("home"); break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest('[data-act="toggle"]'); if (!el) return;
  state.settings[el.dataset.k] = el.checked; applySettings(); save();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").innerHTML) return closeModal();
  if (e.target.tagName === "TEXTAREA" || $("#modal").innerHTML) return;
  if (L && !L.cheat) {
    const it = L.items[L.i];
    if (it.type === "mc" && !L.checked && /^[1-4]$/.test(e.key) && +e.key <= it.opts.length) { L.sel = +e.key - 1; render(); }
    else if (e.key === "Enter") { e.preventDefault(); if (it.type === "mc" && !L.checked) checkAnswer(); else if (L.checked || (it.type === "match" && it.done.size === it.pairs.length)) nextItem(); }
  } else if (L && L.cheat && e.key === "Enter") { e.preventDefault(); L.cheat = false; render(); }
  else if (SIM && !SIM.done && view === "sim") {
    const k = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}[e.key.toLowerCase()];
    if (k !== undefined) { SIM.ans[SIM.i] = k; render(); }
    else if (e.key === "ArrowRight" || e.key === "Enter") { if (SIM.i < SIM.ids.length - 1) { SIM.i++; render(); } }
    else if (e.key === "ArrowLeft") { SIM.i = Math.max(0, SIM.i - 1); render(); }
  }
});

applySettings();
if (state.lastDay && dayNum() - dayNum(state.lastDay) > 1 && state.streak) { state.streak = 0; }
render();
</script>
</body>
</html>
